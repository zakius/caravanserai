# Every push to master builds and tests. When app/build.gradle.kts has a versionName with no release yet, the run also
# signs (tools/release.sh) and publishes dragoman, the YouTube Music app, as a GitHub release tagged v<version> on that
# commit. So a merge that bumps the version is the release.
# caravan, the Subsonic app (docs/subsonic.md, "Two apps"), builds in the same Android and Linux desktop jobs and is
# checked for YouTube code (tools/residue_check.py). Its signed APK ships in the same release.
# The desktop app (:desktop) ships in the same release too: a .deb and an .rpm built on Linux and an .msi built on
# Windows, with roma-aac (tools/build-ffmpeg.sh) built for both on Linux.
# The Japanese dictionary (data, a zip) gets its own release, dict-<version>, the first time its version ships, and the
# apps download it from there. The app and the dictionary build in parallel jobs, and the core tests (which need the
# slim dictionary) run in a third. The apps' release is published only once its dictionary release exists and the tests
# pass.
# Releases come only from master because setup-gradle saves the Gradle cache (with SudachiDict and the slim dictionary)
# only on the default branch, and a cache saved by a tag's run is visible to that tag only.
# Secrets: KEYSTORE_BASE64 (the .jks, base64), STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
name: release
on:
  push:
    branches: [master]
  # A pull request gets the build and packages before it merges. Nothing is signed or published off master.
  pull_request:
permissions:
  contents: write
# Setting git's default branch name explicitly quiets the hint it prints in every checkout.
env: { GIT_CONFIG_COUNT: 1, GIT_CONFIG_KEY_0: init.defaultBranch, GIT_CONFIG_VALUE_0: master }
# Merges in quick succession release one at a time, so a version can't be published twice. A pull request's runs get
# a group of their own, because in the release group a queued PR run would cancel master's waiting release run.
concurrency: { group: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'release' }}", cancel-in-progress: false }
# Jobs pin ubuntu-24.04 rather than ubuntu-latest, so the image the release is built and tested on changes only on
# purpose, not when GitHub moves the alias.
jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - name: New version?
        id: check
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Only "release not found" means a new version; any other error (network, rate limit) fails the run. Only
          # master releases; a pull request's run only builds.
          if [ "$GITHUB_REF" != refs/heads/master ]; then echo "release=" >> "$GITHUB_OUTPUT"
          elif out=$(gh release view "v$v" 2>&1); then echo "release=" >> "$GITHUB_OUTPUT"
          elif [[ $out == *"release not found"* ]]; then echo "release=1" >> "$GITHUB_OUTPUT"
          else echo "$out" >&2; exit 1; fi

  app:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env: { RELEASE: "${{ needs.version.outputs.release }}" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - name: Android SDK and pigz
        run: |
          yes 2> /dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          sudo apt-get install -y pigz > /dev/null
      - name: Signing key
        if: env.RELEASE
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - run: tools/release.sh app
      - if: env.RELEASE
        uses: actions/upload-artifact@v7
        with: { name: app, path: "dist/*.apk" }
      # The unsigned caravan APK, for trying it out. The residue check above has already passed.
      - uses: actions/upload-artifact@v7
        with: { name: subsonic-app, path: app/build/outputs/apk/subsonic/release/app-subsonic-release-unsigned.apk }

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - run: tools/release.sh test

  # roma-aac is the audio-only ffmpeg in the desktop packages (tools/build-ffmpeg.sh), for Linux and, cross-compiled,
  # for Windows. It has its own job, cached per build script, so both desktop jobs start together instead of Windows
  # waiting on Linux.
  roma-aac:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - id: cache
        uses: actions/cache@v4
        with: { path: aac, key: "roma-aac-${{ hashFiles('tools/build-ffmpeg.sh') }}" }
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y musl-tools > /dev/null && tools/build-ffmpeg.sh linux aac/linux && tools/build-ffmpeg.sh windows aac/windows
      - uses: actions/upload-artifact@v7
        with: { name: roma-aac, path: aac }

  # The desktop app's Linux packages: the ProGuard-shrunk app on the distribution's Java (tools/linux-packages.sh).
  desktop-linux:
    needs: roma-aac
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/download-artifact@v8
        with: { name: roma-aac, path: aac }
      - run: chmod +x aac/linux/roma-aac && sudo apt-get install -y rpm > /dev/null # artifacts lose the executable bit
      - run: ./gradlew -q :desktop:createReleaseDistributable :desktop:icuCheck :desktop:skiaCheck :desktop-subsonic:createReleaseDistributable "-Proma.aacDir=$GITHUB_WORKSPACE/aac"
      - run: desktop/build/compose/binaries/main-release/app/dragoman/bin/dragoman --check
      - name: Neither app carries the other's code
        run: |
          python3 tools/residue_check.py youtube desktop/build/compose/binaries/main-release/app/dragoman
          python3 tools/residue_check.py subsonic desktop/subsonic/build/compose/binaries/main-release/app/*
          desktop/subsonic/build/compose/binaries/main-release/app/*/bin/* --check
      - run: tools/linux-packages.sh --no-gradle
      - uses: actions/upload-artifact@v7
        with: { name: desktop-linux, path: "dist/dragoman*" }
      # ProGuard renames the desktop classes; the release keeps the mapping that reads their stack traces (retrace).
      - uses: actions/upload-artifact@v7
        with: { name: desktop-mapping, path: desktop/build/proguard-mapping.txt }

  # Windows: the full .msi with its own Java, and the small .msi and .zip, which find Java 21 or later or download it
  # once (tools/windows-packages.sh). Each one is started once with --check. The job uses Temurin 21 because Temurin 24
  # and later ship no jmods, which ProGuard and jlink read.
  desktop-windows:
    needs: roma-aac
    runs-on: windows-2025
    timeout-minutes: 20
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/download-artifact@v8
        with: { name: roma-aac, path: aac }
      - run: ./gradlew -q :desktop:packageReleaseMsi :desktop:createReleaseDistributable :desktop:skiaCheck "-Proma.aacDir=$GITHUB_WORKSPACE/aac"
      - name: Check the full build
        shell: pwsh
        run: |
          $p = Start-Process desktop/build/compose/binaries/main-release/app/dragoman/dragoman.exe -ArgumentList --check -Wait -PassThru -RedirectStandardOutput check.txt -RedirectStandardError check-err.txt
          Get-Content check.txt, check-err.txt
          exit $p.ExitCode
      - run: tools/windows-packages.sh
      - name: Check the small build
        shell: pwsh
        run: |
          $p = Start-Process desktop/build/windows-small/dragoman/dragoman.exe -ArgumentList --check -Wait -PassThru -RedirectStandardOutput check.txt -RedirectStandardError check-err.txt
          Get-Content check.txt, check-err.txt
          exit $p.ExitCode
      - uses: actions/upload-artifact@v7
        with: { name: desktop-windows, path: "dist/dragoman*" }

  # Built only when its version has no release yet; otherwise this job ends after one API call.
  dict:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: { RELEASE: "${{ needs.version.outputs.release }}" }
    steps:
      - uses: actions/checkout@v5
      - name: Dictionary already released?
        id: check
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v=$(sed -n 's/^val dictRelease = "\(.*\)"/\1/p' core/build.gradle.kts)
          echo "tag=dict-$v" >> "$GITHUB_OUTPUT"
          if gh release view "dict-$v" > /dev/null 2>&1; then echo "build=" >> "$GITHUB_OUTPUT"; else echo "build=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.build
        uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - if: steps.check.outputs.build
        uses: gradle/actions/setup-gradle@v5
      # Nothing Android is built, but Gradle configures the Android modules too.
      - name: Android SDK
        if: steps.check.outputs.build
        run: yes 2> /dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - if: steps.check.outputs.build
        run: tools/release.sh dict
      - name: Publish
        if: steps.check.outputs.build && env.RELEASE
        env: { GH_TOKEN: "${{ github.token }}", DICT: "${{ steps.check.outputs.tag }}" }
        run: |
          gh release create "$DICT" "dist/roma-dict-${DICT#dict-}.zip" --target "$GITHUB_SHA" --latest=false --title "Japanese dictionary ${DICT#dict-}" \
            --notes "SudachiDict core ${DICT#dict-} for roma, without what roma never reads (postal addresses, split and synonym data; duplicate cost rows merged), with its notices. roma downloads it when Japanese is romanized. SudachiDict is Apache-2.0 (Works Applications)."

  publish:
    if: needs.version.outputs.release
    needs: [version, app, dict, test, desktop-linux, desktop-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v8
        with: { name: app, path: dist }
      - uses: actions/download-artifact@v8
        with: { pattern: "desktop-*", path: dist, merge-multiple: true }
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}", V: "${{ needs.version.outputs.version }}" }
        run: |
          # The release notes are the version's own commit message ("0.1.28: …"), which may sit below later fixes in this
          # push.
          git log -1 --format=%B --grep "^$V:" "$GITHUB_SHA" | grep -v '^Co-Authored-By' > "$RUNNER_TEMP/notes.md"
          # javax.json ships in the APK under GPL 2 with the Classpath Exception, so its source goes with each release.
          json=dist/javax.json-1.1.4-sources.jar
          curl -sfL -o "$json" https://repo1.maven.org/maven2/org/glassfish/javax.json/1.1.4/javax.json-1.1.4-sources.jar
          echo "31d21d4721eb050616683bee90e3c7d126110dffdbf8bf4d3cc992891a60419b  $json" | sha256sum -c -
          # roma-aac, in the desktop packages, is ffmpeg (LGPL 2.1): its source goes with each release too.
          ffmpeg=$(sed -n 's/^FFMPEG=//p' tools/build-ffmpeg.sh)
          sha=$(sed -n 's/^FFMPEG_SHA=//p' tools/build-ffmpeg.sh)
          curl -sfL -o "dist/ffmpeg-$ffmpeg.tar.xz" "https://ffmpeg.org/releases/ffmpeg-$ffmpeg.tar.xz"
          echo "$sha  dist/ffmpeg-$ffmpeg.tar.xz" | sha256sum -c -
          gh release create "v$V" dist/dragoman-$V.apk dist/caravan-$V.apk "$json" dist/dragoman_${V}_amd64.deb dist/dragoman-$V-1.x86_64.rpm dist/dragoman-$V-x64.msi \
            dist/dragoman-$V-x64-full.msi dist/dragoman-$V-windows-x64.zip dist/proguard-mapping.txt "dist/ffmpeg-$ffmpeg.tar.xz" --target "$GITHUB_SHA" --title "dragoman and caravan $V" --notes-file "$RUNNER_TEMP/notes.md" --latest
