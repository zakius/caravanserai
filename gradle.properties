org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
# The two apps (docs/subsonic.md, Two apps): roma, for Subsonic servers and Google Play, and roma ytm, for YouTube
# Music, released on GitHub. Everything user-visible reads these, on Android (app/build.gradle.kts) and the desktop
# (desktop/build.gradle.kts): the name shown, the package id (permanent once on Google Play), and the slug for the data
# folder, Last.fm's sign-in link and the packages.
subsonicApp.name=roma
subsonicApp.id=com.zakius.roma
subsonicApp.slug=roma
youtubeApp.name=roma ytm
youtubeApp.id=com.zakius.roma.mty
youtubeApp.slug=roma-ytm
